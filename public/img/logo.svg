    <path d="M43 23c5.8 0 9 3.6 9 8.6 0 5-2.4 8-2.4 12.8 0 6.2-1.6 10.6-6.6 10.6-4.6 0-6.2-3.6-6.2-7.6 0-3.4 1-5.3.8-8.5-.2-3.3-2.6-5.3-2.6-9.3 0-4.4 3.5-6.6 8-6.6z"/>
    <circle cx="38.4" cy="16.8" r="3.6"/>
